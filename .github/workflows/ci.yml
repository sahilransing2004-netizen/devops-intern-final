name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the publish job raises it only where needed.
permissions:
  contents: read

env:
  IMAGE_NAME: devops-intern-final

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t "$IMAGE_NAME:${{ github.sha }}" app/
      - name: Show image size
        run: docker images "$IMAGE_NAME"
      - name: Save image
        run: docker save "$IMAGE_NAME:${{ github.sha }}" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: docker load -i image.tar
      - name: Start container
        run: docker run -d --name app -p 8080:8080 "$IMAGE_NAME:${{ github.sha }}"
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/healthz >/dev/null; then
              echo "Ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Container never became ready" >&2
          docker logs app
          exit 1
      - name: Run healthcheck script (fails the job on non-200)
        run: ./scripts/healthcheck.sh http://localhost:8080/healthz
      - name: Container logs
        if: always()
        run: docker logs app

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: docker load -i image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push (commit SHA + latest)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          remote="ghcr.io/${owner}/${IMAGE_NAME}"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$remote:${{ github.sha }}"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$remote:latest"
          docker push "$remote:${{ github.sha }}"
          docker push "$remote:latest"
